[package]
name = "jacobe-skills"
version = "0.1.4"
description = "A local-first Skill and MCP library"
authors = ["Jacobe"]
edition = "2021"

[lib]
name = "jacobe_skills_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2"
toml_edit = "0.23"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
aes-gcm = "0.10"
getrandom = "0.3"
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
